<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password - Freelancer Hub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: #f5f6fb;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .page-icon {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            background: #6366f1;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            margin-bottom: 18px;
        }

        h2 {
            font-size: 24px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 6px;
        }

        .description {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 500;
            color: #374151;
        }

        .form-control {
            height: 45px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
        }

        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .password-btn {
            width: 100%;
            border: none;
            background: #6366f1;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            margin-top: 10px;
        }

        .password-btn:hover {
            background: #4f46e5;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #6366f1;
            text-decoration: none;
            font-size: 13px;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        .alert {
            font-size: 13px;
            border-radius: 10px;
        }

    </style>

</head>

<body>

<div class="password-card">

    <div class="page-icon">
        <i class="bi bi-shield-lock-fill"></i>
    </div>

    <h2>Change Password</h2>

    <p class="description">
        Update your freelancer account password securely.
    </p>


    {% if error %}

    <div class="alert alert-danger">
        <i class="bi bi-exclamation-circle me-1"></i>
        {{ error }}
    </div>

    {% endif %}


    {% if success %}

    <div class="alert alert-success">
        <i class="bi bi-check-circle me-1"></i>
        {{ success }}
    </div>

    {% endif %}


    <form method="POST"
          action="{{ url_for('change_password') }}">

        <div class="mb-3">

            <label class="form-label">
                Current Password
            </label>

            <input
                type="password"
                name="current_password"
                class="form-control"
                placeholder="Enter current password"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                New Password
            </label>

            <input
                type="password"
                name="new_password"
                class="form-control"
                placeholder="Enter new password"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Confirm New Password
            </label>

            <input
                type="password"
                name="confirm_password"
                class="form-control"
                placeholder="Confirm new password"
                required
            >

        </div>


        <button type="submit"
                class="password-btn">

            <i class="bi bi-key-fill me-1"></i>

            Change Password

        </button>

    </form>


    <a href="{{ url_for('freelancer_settings') }}"
       class="back-btn">

        <i class="bi bi-arrow-left me-1"></i>

        Back to Settings

    </a>

</div>

</body>

</html>
